services:
  woodsmith:
    image: woodsmith:prod
    container_name: woodsmith
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
      SELF_HOSTED: "true"
      SITE_URL: "${SITE_URL}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      MEDIA_ROOT: "/app/pics"
      DATA_ROOT: "/app/site/data"
      STUDIO_PASSWORD: "${STUDIO_PASSWORD}"
      SESSION_SECRET: "${SESSION_SECRET}"
      VISUAL_AUDIT_TOKEN: "${VISUAL_AUDIT_TOKEN}"
      VISUAL_AUDIT_MAX_RECORDS: "${VISUAL_AUDIT_MAX_RECORDS:-5000}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
      EASYPOST_API_KEY: "${EASYPOST_API_KEY}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Beaman Woodworks}"
      SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_IMAGE_MODEL: "${OPENAI_IMAGE_MODEL}"
      OPENAI_IMAGE_SIZE: "${OPENAI_IMAGE_SIZE}"
      OPENAI_IMAGE_QUALITY: "${OPENAI_IMAGE_QUALITY}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-4o-mini}"
      ENABLE_PUBLIC_AI_RENDERING: "${ENABLE_PUBLIC_AI_RENDERING}"
      ENABLE_AI_BACKGROUND_CLEANUP: "${ENABLE_AI_BACKGROUND_CLEANUP}"
      ENABLE_EMBEDDING_SEARCH: "${ENABLE_EMBEDDING_SEARCH}"
      ENABLE_AI_MEDIA_ANALYSIS: "${ENABLE_AI_MEDIA_ANALYSIS:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-local}"
      AI_ANALYSIS_PROVIDER: "${AI_ANALYSIS_PROVIDER:-local-sidecar}"
      AI_EMBEDDING_PROVIDER: "${AI_EMBEDDING_PROVIDER:-local-clip}"
      AI_FALLBACK_PROVIDER: "${AI_FALLBACK_PROVIDER:-disabled}"
      ENABLE_LOCAL_IMAGE_EMBEDDINGS: "${ENABLE_LOCAL_IMAGE_EMBEDDINGS:-true}"
      ENABLE_GEMINI_FALLBACK: "${ENABLE_GEMINI_FALLBACK:-false}"
      LOCAL_AI_SIDECAR_URL: "${LOCAL_AI_SIDECAR_URL:-http://127.0.0.1:8765}"
      LOCAL_AI_SIDECAR_TOKEN: "${LOCAL_AI_SIDECAR_TOKEN:-}"
      LOCAL_EMBEDDING_MODEL: "${LOCAL_EMBEDDING_MODEL:-sentence-transformers/clip-ViT-B-32}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}"
      OLLAMA_VISION_MODEL: "${OLLAMA_VISION_MODEL:-gemma4}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_VISION_MODEL: "${GEMINI_VISION_MODEL:-gemini-3.1-flash-lite}"
      GEMINI_EMBEDDING_MODEL: "${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}"
      MEDIA_AI_MAX_BATCH: "${MEDIA_AI_MAX_BATCH:-24}"
      MEDIA_AI_REQUEST_TIMEOUT_MS: "${MEDIA_AI_REQUEST_TIMEOUT_MS:-120000}"
      MEDIA_AI_CONFIDENCE_HIGH: "${MEDIA_AI_CONFIDENCE_HIGH:-0.82}"
      MEDIA_AI_CONFIDENCE_MIN: "${MEDIA_AI_CONFIDENCE_MIN:-0.58}"
      MEDIA_AI_AMBIGUITY_DELTA: "${MEDIA_AI_AMBIGUITY_DELTA:-0.08}"
      SHIP_FROM_NAME: "${SHIP_FROM_NAME}"
      SHIP_FROM_STREET1: "${SHIP_FROM_STREET1}"
      SHIP_FROM_CITY: "${SHIP_FROM_CITY}"
      SHIP_FROM_STATE: "${SHIP_FROM_STATE}"
      SHIP_FROM_ZIP: "${SHIP_FROM_ZIP}"
      SHIP_FROM_COUNTRY: "${SHIP_FROM_COUNTRY}"
    volumes:
      - /volume2/docker_ssd/woodsmith/site/data:/app/site/data
      - /volume1/homes/Cooper/Photos/Dad_Woodworking_09262025:/app/pics:rw
      - /volume2/docker_ssd/woodsmith/cache/next-image:/app/site/.next/cache
