services:
  woodsmith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: woodsmith
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
      SELF_HOSTED: "true"
      STUDIO_PASSWORD: "${STUDIO_PASSWORD:-woodsmith-studio}"
      SESSION_SECRET: "${SESSION_SECRET:-change-this-before-public}"
    volumes:
      - /volume2/docker_ssd/woodsmith/site/data:/app/site/data
      - /volume2/docker_ssd/woodsmith/pics:/app/pics:ro
