services:
  woodsmith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: woodsmith
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      SELF_HOSTED: "true"
    volumes:
      # Main website project files
      - /volume2/docker_ssd/woodsmith:/app
      # Newly bound photo directory mapped as Read-Only
      - /volume2/docker_ssd/woodsmith/pics:/app/pics:ro