services:
  woodsmith:
    image: woodsmith:prod
    container_name: woodsmith
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
      SELF_HOSTED: "true"
      SITE_URL: "${SITE_URL}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      MEDIA_ROOT: "/app/pics"
      STUDIO_PASSWORD: "${STUDIO_PASSWORD}"
      SESSION_SECRET: "${SESSION_SECRET}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
      EASYPOST_API_KEY: "${EASYPOST_API_KEY}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SHIP_FROM_NAME: "${SHIP_FROM_NAME}"
      SHIP_FROM_STREET1: "${SHIP_FROM_STREET1}"
      SHIP_FROM_CITY: "${SHIP_FROM_CITY}"
      SHIP_FROM_STATE: "${SHIP_FROM_STATE}"
      SHIP_FROM_ZIP: "${SHIP_FROM_ZIP}"
      SHIP_FROM_COUNTRY: "${SHIP_FROM_COUNTRY}"
    volumes:
      - /volume2/docker_ssd/woodsmith/site/data:/app/site/data
      - /volume2/docker_ssd/woodsmith/pics:/app/pics
      - /volume2/docker_ssd/woodsmith/cache/next-image:/app/site/.next/cache
