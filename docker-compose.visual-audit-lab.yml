services:
  woodsmith-audit-lab:
    image: "${WOODSMITH_AUDIT_APP_IMAGE:-woodsmith:prod}"
    container_name: woodsmith-audit-lab
    restart: "no"
    user: "${PUID:?PUID must be set}:${PGID:?PGID must be set}"
    read_only: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      SELF_HOSTED: "true"
      SITE_URL: http://woodsmith-audit-lab:3002
      NEXT_PUBLIC_SITE_URL: http://woodsmith-audit-lab:3002
      MEDIA_ROOT: /app/pics
      DATA_ROOT: /app/site/data
      STUDIO_PASSWORD: "${AUDIT_LAB_STUDIO_PASSWORD:?AUDIT_LAB_STUDIO_PASSWORD must be set}"
      SESSION_SECRET: "${AUDIT_LAB_SESSION_SECRET:?AUDIT_LAB_SESSION_SECRET must be set}"
      VISITOR_HMAC_KEY_ID: snapshot-lab-v1
      VISITOR_TRACK_INTERNAL: "false"
      VISUAL_AUDIT_TOKEN_FILE: /run/secrets/audit_token
      VISUAL_AUDIT_MAX_RECORDS: "${VISUAL_AUDIT_MAX_RECORDS:-5000}"
      VISUAL_AUDIT_SNAPSHOT_LAB: "true"
      ALLOW_INSECURE_AUDIT_COOKIES: "true"
      WOODSMITH_MEDIA_PROVENANCE: "${AUDIT_MEDIA_PROVENANCE:?AUDIT_MEDIA_PROVENANCE must be set by prepare-snapshot-lab.sh}"
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
      EASYPOST_API_KEY: ""
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      OPENAI_API_KEY: ""
      ENABLE_PUBLIC_AI_RENDERING: "false"
      ENABLE_AI_BACKGROUND_CLEANUP: "false"
      ENABLE_AI_MEDIA_ANALYSIS: "false"
      ENABLE_EMBEDDING_SEARCH: "false"
      SEARCH_SEMANTIC_TIMEOUT_MS: "250"
      ENABLE_LOCAL_IMAGE_EMBEDDINGS: "false"
      ENABLE_GEMINI_FALLBACK: "false"
      AI_PROVIDER: disabled
      AI_ANALYSIS_PROVIDER: disabled
      AI_EMBEDDING_PROVIDER: disabled
      AI_FALLBACK_PROVIDER: disabled
      LOCAL_AI_SIDECAR_URL: http://127.0.0.1:9
      OLLAMA_BASE_URL: http://127.0.0.1:9
    expose:
      - "3002"
    volumes:
      - "${AUDIT_LAB_DATA_DIR:?AUDIT_LAB_DATA_DIR must be set}:/app/site/data:rw"
      - "${AUDIT_LAB_MEDIA_DIR:?AUDIT_LAB_MEDIA_DIR must be set}:/app/pics:rw"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /app/site/.next/cache:rw,noexec,nosuid,nodev,size=128m,mode=700,uid=${PUID},gid=${PGID}
    secrets:
      - audit_token
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - audit-lab
    healthcheck:
      test: ["CMD", "node", "--experimental-sqlite", "-e", "const{DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('/app/site/data/woodsmith.sqlite',{readOnly:true});const ok=d.prepare('PRAGMA quick_check').all().some(r=>r.quick_check==='ok');d.close();if(!ok)process.exit(1);fetch('http://127.0.0.1:3002/studio/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  visual-audit:
    image: "${WOODSMITH_VISUAL_AUDIT_IMAGE:-woodsmith-visual-audit:latest}"
    build:
      context: .
      dockerfile: visual-audit/Dockerfile
    container_name: woodsmith-visual-audit-lab-runner
    init: true
    ipc: host
    read_only: true
    user: "${PUID:?PUID must be set}:${PGID:?PGID must be set}"
    depends_on:
      woodsmith-audit-lab:
        condition: service_healthy
    environment:
      TARGET_MODE: snapshot-lab
      AUDIT_EVIDENCE_TIER: "${AUDIT_EVIDENCE_TIER:?AUDIT_EVIDENCE_TIER must be set by prepare-snapshot-lab.sh}"
      BASE_URL: http://woodsmith-audit-lab:3002
      TARGET_COMMIT_SHA: "${TARGET_COMMIT_SHA:?TARGET_COMMIT_SHA must be set}"
      AUDIT_RUN_ID: "${AUDIT_RUN_ID:?AUDIT_RUN_ID must be set}"
      AUDIT_SCOPE: "${AUDIT_SCOPE:-full}"
      AUDIT_RESUME: "${AUDIT_RESUME:-true}"
      RUN_OUTPUT_ROOT: /output
      REPO_ROOT: /workspace
      AUDIT_TMP_ROOT: /audit-tmp
      APPROVED_BASELINE_ROOT: "${APPROVED_BASELINE_ROOT:-}"
      WOODSMITH_ADMIN_EMAIL: "${WOODSMITH_ADMIN_EMAIL:-woodsmithbb@proton.me}"
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      AUDIT_TOKEN_FILE: /run/secrets/audit_token
      MAX_FULL_PAGE_DEVICE_HEIGHT: "${MAX_FULL_PAGE_DEVICE_HEIGHT:-50000}"
      MAX_STITCHED_SEGMENT_HEIGHT: "${MAX_STITCHED_SEGMENT_HEIGHT:-60000}"
      AUDIT_STRICT_DIAGNOSTICS: "${AUDIT_STRICT_DIAGNOSTICS:-true}"
      VISUAL_AUDIT_ACCELERATOR: "${VISUAL_AUDIT_ACCELERATOR:-auto}"
      VISUAL_AUDIT_CAPTURE_WORKERS: "${VISUAL_AUDIT_CAPTURE_WORKERS:-auto}"
      VISUAL_AUDIT_VALIDATION_WORKERS: "${VISUAL_AUDIT_VALIDATION_WORKERS:-auto}"
      VISUAL_AUDIT_REPORT_WORKERS: "${VISUAL_AUDIT_REPORT_WORKERS:-auto}"
      AUDIT_VISUAL_MATERIALIZATION: "${AUDIT_VISUAL_MATERIALIZATION:-selective}"
      AUDIT_RETAIN_RAW_TILES: "${AUDIT_RETAIN_RAW_TILES:-false}"
      AUDIT_TARGET_RUNTIME_MINUTES: "${AUDIT_TARGET_RUNTIME_MINUTES:-30}"
      AUDIT_HARD_RUNTIME_MINUTES: "${AUDIT_HARD_RUNTIME_MINUTES:-45}"
      AUDIT_ROUTE_TASK_SECONDS: "${AUDIT_ROUTE_TASK_SECONDS:-2.4}"
      AUDIT_SPECIAL_TASK_SECONDS: "${AUDIT_SPECIAL_TASK_SECONDS:-3.2}"
      AUDIT_MUTATION_TASK_SECONDS: "${AUDIT_MUTATION_TASK_SECONDS:-8}"
      AUDIT_MATERIALIZATION_SECONDS: "${AUDIT_MATERIALIZATION_SECONDS:-0.8}"
      AUDIT_REPORT_RUNTIME_SECONDS: "${AUDIT_REPORT_RUNTIME_SECONDS:-60}"
      AUDIT_VALIDATION_RUNTIME_SECONDS: "${AUDIT_VALIDATION_RUNTIME_SECONDS:-60}"
      AUDIT_FIXED_RUNTIME_SECONDS: "${AUDIT_FIXED_RUNTIME_SECONDS:-60}"
      AUDIT_PERSISTENT_BYTES_PER_MATERIALIZATION: "${AUDIT_PERSISTENT_BYTES_PER_MATERIALIZATION:-4194304}"
      AUDIT_TEMP_BYTES_PER_MATERIALIZATION: "${AUDIT_TEMP_BYTES_PER_MATERIALIZATION:-2097152}"
      AUDIT_REPORT_ARTIFACT_MULTIPLIER: "${AUDIT_REPORT_ARTIFACT_MULTIPLIER:-1}"
      AUDIT_PROJECTED_WRITE_AMPLIFICATION_RATIO: "${AUDIT_PROJECTED_WRITE_AMPLIFICATION_RATIO:-1.25}"
      AUDIT_MEDIA_INSPECTOR_BATCH_SIZE: "${AUDIT_MEDIA_INSPECTOR_BATCH_SIZE:-8}"
      AUDIT_ELEMENT_ATLAS_BATCH_SIZE: "${AUDIT_ELEMENT_ATLAS_BATCH_SIZE:-12}"
      AUDIT_TASK_SHARD_INDEX: "${AUDIT_TASK_SHARD_INDEX:-0}"
      AUDIT_TASK_SHARD_COUNT: "${AUDIT_TASK_SHARD_COUNT:-1}"
      AUDIT_EXECUTION_PHASE: "${AUDIT_EXECUTION_PHASE:-all}"
      AUDIT_BENCHMARK_TASK_LIMIT: "${AUDIT_BENCHMARK_TASK_LIMIT:-24}"
      AUDIT_BENCHMARK_CHILD_TIMEOUT_MS: "${AUDIT_BENCHMARK_CHILD_TIMEOUT_MS:-120000}"
    volumes:
      - ./:/workspace:ro
      - /volume2/docker_ssd/woodsmith/visual-audits:/output:rw
    tmpfs:
      - /audit-tmp:rw,noexec,nosuid,nodev,size=256m,mode=700,uid=${PUID},gid=${PGID}
      - /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777
    secrets:
      - admin_password
      - audit_token
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - audit-lab
    restart: "no"

secrets:
  admin_password:
    file: ./secrets/woodsmith_audit_lab_password
  audit_token:
    file: ./secrets/woodsmith_visual_audit_token

networks:
  audit-lab:
    internal: true
